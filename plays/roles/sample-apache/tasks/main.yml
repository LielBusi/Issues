---
- name: Ensure httpd, mod_ssl and php packages are installed
  # package module uses yum automatically on RHEL and apt on ubuntu.
  ansible.builtin.package:
    name:
      - httpd
      - mod_ssl
      - php
    state: present

- name: Ensure apahce service is running and enabled on boot
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true

- name: Configure firewall to allow all incoming traffic on HTTP and HTTPS.
  ansible.builtin.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: yes
  loop:
    - http
    - https

- name: Create file /var/www/html/index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: "{{ apache_user }}"
    group: "{{ apache_group }}"
    mode: '0644'
  notify:
    - Restart apache