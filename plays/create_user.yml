---
- name: Create automation user with root access
  hosts: all
  become: true
  vars_files:
    - ./vault-pass.yml

  vars:
    ssh_user: automation
    ssh_key_path: "~/.ssh/id_ed25519.pub"

  tasks:
    - name: Ensure automation user exists
      ansible.builtin.user:
        name: "{{ ssh_user }}"
        password: "{{ automation_password | password_hash('sha512') }}"
        groups: wheel
        append: yes
        shell: /bin/bash
        state: present
        create_home: yes

    - name: Ensure automation user has passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/automation
        content: "automation ALL=(ALL) NOPASSWD: ALL\n"
        mode: '0440'

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ ssh_user }}/.ssh"
        state: directory
        mode: '0700'
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
    
    - name: Copy public key from control node to authorized_keys
      ansible.builtin.copy:
        src: "{{ ssh_key_path }}"
        dest: "/home/{{ ssh_user }}/.ssh/authorized_keys"
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0600'

